<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>README Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f0f6fc;
    }

    p.subtitle {
      color: #8b949e;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.95rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #388bfd;
    }

    input[type="text"]::placeholder {
      color: #484f58;
    }

    button {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid #fff4;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      display: none;
      background: #2d1214;
      border: 1px solid #f8514933;
      border-radius: 6px;
      color: #f85149;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .output-section { display: none; }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .output-header span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .copy-btn {
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .copy-btn:hover { background: #30363d; color: #f0f6fc; }

    #output {
      width: 100%;
      min-height: 400px;
      padding: 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      resize: vertical;
      white-space: pre-wrap;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>README Generator</h1>
    <p class="subtitle">Paste a GitHub repository URL to generate a README with Claude.</p>

    <div class="input-row">
      <input
        type="text"
        id="repoUrl"
        placeholder="https://github.com/owner/repo"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="generateBtn" onclick="generate()">
        <span class="spinner" id="spinner"></span>
        Generate
      </button>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <div class="output-section" id="outputSection">
      <div class="output-header">
        <span>Generated README.md</span>
        <button class="copy-btn" onclick="copyOutput()">Copy</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

  <script>
    async function generate() {
      const url = document.getElementById("repoUrl").value.trim();
      const btn = document.getElementById("generateBtn");
      const spinner = document.getElementById("spinner");
      const errorBanner = document.getElementById("errorBanner");
      const outputSection = document.getElementById("outputSection");
      const output = document.getElementById("output");

      errorBanner.style.display = "none";
      outputSection.style.display = "none";

      if (!url) {
        showError("Please enter a GitHub repository URL.");
        return;
      }

      btn.disabled = true;
      spinner.style.display = "inline-block";

      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          showError(data.error || "An unexpected error occurred.");
          return;
        }

        output.textContent = data.readme;
        outputSection.style.display = "block";
      } catch (err) {
        showError("Could not reach the server. Is it running?");
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    }

    function showError(msg) {
      const banner = document.getElementById("errorBanner");
      banner.textContent = msg;
      banner.style.display = "block";
    }

    function copyOutput() {
      const text = document.getElementById("output").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy"; }, 2000);
      });
    }

    document.getElementById("repoUrl").addEventListener("keydown", (e) => {
      if (e.key === "Enter") generate();
    });
  </script>
</body>
</html>
